<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Effects first. 先展示，再解释。</title>
  <desc id="desc">An original schematic project-page mockup alongside a three-step workflow. The media panels are conceptual illustrations, not research results.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#323f72"/><stop offset="1" stop-color="#18243a"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7c8e6"/><stop offset="1" stop-color="#7f9fad"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8c9ee6"/><stop offset="1" stop-color="#80d5c5"/></linearGradient>
    <clipPath id="media"><rect x="90" y="356" width="526" height="238" rx="12"/></clipPath>
  </defs>
  <rect width="1440" height="760" rx="24" fill="#f5f4ee"/>
  <g font-family="Inter,Segoe UI,Arial,Microsoft YaHei,sans-serif">
    <text x="56" y="59" fill="#697077" font-size="15" font-weight="600" letter-spacing="2">PAPER PROJECT PAGE SKILL</text>
    <text x="56" y="153" fill="#152333" font-size="79" font-weight="700" letter-spacing="-3">Effects first.</text>
    <text x="58" y="203" fill="#4c5863" font-size="26">先让效果被看见，再让方法被理解。</text>
    <rect x="1130" y="115" width="250" height="41" rx="20" fill="#e5e9de"/>
    <text x="1255" y="142" fill="#415248" font-size="16" text-anchor="middle">AESTHETICS + CLARITY</text>

    <rect x="56" y="253" width="899" height="433" rx="20" fill="#101827"/>
    <path d="M56 304h899" stroke="#334054"/>
    <circle cx="84" cy="280" r="5" fill="#81909f"/><circle cx="102" cy="280" r="5" fill="#81909f"/><circle cx="120" cy="280" r="5" fill="#81909f"/>
    <text x="151" y="285" fill="#9aacc0" font-size="13">project-page / concept</text>
    <text x="711" y="285" fill="#cbd5e1" font-size="12" letter-spacing="2">PAPER · CODE · DEMO</text>
    <text x="90" y="338" fill="#f5f7fb" font-size="19" font-weight="600">A clear result. A reason to explore.</text>
    <g clip-path="url(#media)">
      <rect x="90" y="356" width="526" height="238" fill="url(#light)"/>
      <circle cx="499" cy="411" r="28" fill="#e3e4c8"/>
      <path d="M90 523l93-96 105 106 80-73 136 86 112-80v128H90z" fill="#526b80"/>
      <path d="M90 564l173-71 143 75 98-48 112 51v23H90z" fill="#344d62"/>
      <path d="M282 594l72-30 39-4 30-12 35-5" fill="none" stroke="#bde7d8" stroke-width="5"/>
    </g>
    <rect x="108" y="372" width="147" height="24" rx="12" fill="#101827" fill-opacity="0.65"/>
    <text x="182" y="389" fill="#fff" font-size="11" text-anchor="middle" letter-spacing="1">ANCHOR DEMO</text>
    <circle cx="353" cy="476" r="26" fill="#f5f4ee" fill-opacity="0.93"/>
    <path d="M346 463v26l21-13z" fill="#263a4c"/>
    <rect x="638" y="356" width="283" height="112" rx="12" fill="url(#screen)"/>
    <path d="M656 437c22-30 40-42 64-21s54 22 86-7 72-11 95 8" fill="none" stroke="#97b9c9" stroke-width="4"/>
    <text x="655" y="382" fill="#d5ddee" font-size="11" letter-spacing="1">SAME PROMPT / METHOD A</text>
    <rect x="638" y="482" width="283" height="112" rx="12" fill="#203744"/>
    <path d="M656 558c22-30 40-42 64-21s54 22 86-7 72-11 95 8" fill="none" stroke="#8adcc7" stroke-width="4"/>
    <text x="655" y="508" fill="#d5e9e5" font-size="11" letter-spacing="1">SAME PROMPT / METHOD B</text>
    <text x="92" y="625" fill="#f5f7fb" font-size="15">先看效果 · 看清差别 · 按需展开</text>
    <rect x="91" y="643" width="743" height="4" rx="2" fill="#334054"/>
    <rect x="91" y="643" width="325" height="4" rx="2" fill="url(#trail)"/>
    <text x="921" y="650" fill="#b9c5d1" font-size="12" text-anchor="end">PROMPT +</text>

    <text x="1006" y="295" fill="#8d9c7a" font-size="15" letter-spacing="2">THE WORKFLOW</text>
    <path d="M1026 338v232" fill="none" stroke="#d0d6cc" stroke-width="2"/>
    <g fill="#152333"><circle cx="1026" cy="352" r="20"/><circle cx="1026" cy="463" r="20"/><circle cx="1026" cy="574" r="20"/></g>
    <g fill="#f5f4ee" font-size="14" text-anchor="middle"><text x="1026" y="357">01</text><text x="1026" y="468">02</text><text x="1026" y="579">03</text></g>
    <g fill="#152333" font-size="25" font-weight="600"><text x="1064" y="358">先选视觉方向</text><text x="1064" y="469">围绕效果编排</text><text x="1064" y="580">再展开论文细节</text></g>
    <g fill="#65717a" font-size="17"><text x="1064" y="390">2–3 directions, your choice</text><text x="1064" y="501">Showcase · compare · explore</text><text x="1064" y="612">Explain only what helps</text></g>
    <text x="59" y="724" fill="#7b8489" font-size="13">CONCEPT ILLUSTRATION · 页面与媒体均为结构示意，不代表真实论文结果</text>
